<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="teal" data-mode="light">
<head>
<meta charset="UTF-8">
<script>
try {
  const savedTheme = localStorage.getItem('schoolpanel.theme');
  if (/^(teal|purple|blue|green|orange)-(light|dark)$/.test(savedTheme || '')) {
    const [palette, mode] = savedTheme.split('-');
    document.documentElement.dataset.theme = palette;
    document.documentElement.dataset.mode = mode;
  }
} catch (_) {}
</script>

<style>
:root{
  --ink:#1a3a8f; --ink-press:#132d73; --desk:#102152;
  --paper:#fbfcff; --rule:#dde7f7; --margin:#e4506a;
  --text:#1c2540; --muted:#56607f; --edge:#8ea3d3;
  --err:#b3261e; --err-bg:#fdeceb; --info-bg:#eaf0fc;
  --step:34px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--desk);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;
  background:var(--desk);color:var(--text);line-height:1.8;
  font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif;
}

/* The page is a ruled school notebook sheet; the red margin sits on the right (RTL). */
.sheet{
  position:relative;width:100%;max-width:30rem;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--step) - 1px),var(--rule) calc(var(--step) - 1px),var(--rule) var(--step));
  padding:28px 20px 28px 22px;padding-right:60px;
}
@supports (padding:max(1px,2px)){
  .sheet{padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom))}
}
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;right:30px;width:4px;
  border-left:2px solid var(--margin);border-right:2px solid var(--margin);
  transform-origin:top;animation:draw .9s .1s ease-out both;
}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}

h1{margin:0 0 4px;font-size:2.25rem;line-height:1.4;font-weight:800;color:var(--ink)}
.lead{margin:0 0 26px;max-width:24rem;font-size:1rem;color:var(--muted)}
.boot{margin:0;color:var(--muted)}

.field{margin-bottom:18px}
label{display:block;margin:0 0 6px;font-size:.95rem;font-weight:700}
input{
  width:100%;height:52px;padding:0 14px;border:1.5px solid var(--edge);border-radius:8px;
  background:#fff;color:var(--text);font:inherit;font-size:1.05rem;direction:ltr;text-align:right;
}
input:focus{outline:3px solid rgba(26,58,143,.28);outline-offset:1px;border-color:var(--ink)}
.pw{position:relative}
.pw input{padding-left:88px}
.reveal{
  position:absolute;left:6px;top:6px;height:40px;padding:0 12px;border:0;border-radius:6px;
  background:transparent;color:var(--ink);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;
}
.reveal:hover{background:var(--info-bg)}
.reveal:focus-visible{outline:3px solid rgba(26,58,143,.28)}

.msg{margin:0 0 14px;font-size:.95rem;line-height:1.8}
.msg:empty{margin:0}
.msg[data-kind]{padding:10px 12px;border-radius:8px}
.msg[data-kind="err"]{background:var(--err-bg);color:var(--err)}
.msg[data-kind="info"]{background:var(--info-bg);color:var(--ink)}

.go{
  width:100%;height:54px;border:0;border-radius:8px;background:var(--ink);color:#fff;
  font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;transition:background .15s;
}
.go:hover{background:var(--ink-press)}
.go:active{transform:translateY(1px)}
.go:focus-visible{outline:3px solid rgba(26,58,143,.35);outline-offset:3px}
.go[disabled]{opacity:.75;cursor:progress}
.spin{
  display:none;width:1em;height:1em;margin-right:.55em;vertical-align:-.15em;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite;
}
.go.busy .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.linkbtn{
  display:block;margin:14px 0 0;padding:6px 0;border:0;background:none;color:var(--ink);
  font:inherit;font-size:.95rem;font-weight:700;text-decoration:underline;cursor:pointer;
}
.help{margin:22px 0 0;font-size:.9rem;line-height:1.9;color:var(--muted)}

@media (min-width:34rem){
  body{align-items:center;padding:40px 16px}
  .sheet{min-height:0;border-radius:10px;box-shadow:0 30px 70px rgba(0,0,0,.4);padding:56px 36px 56px 30px;padding-right:80px}
  .sheet::before{right:44px}
}
@media (prefers-reduced-motion:reduce){
  .sheet::before{animation:none}
  .spin{animation-duration:1.6s}
}
</style>

.go:hover{transform:translateY(-2px)!important;box-shadow:0 15px 31px rgba(var(--brand-rgb),.25)!important}
.go:active{transform:scale(.99)!important}
.linkbtn{transition:transform .22s var(--sfx-spring),color .2s ease!important}
.linkbtn:hover{transform:translateX(-4px)}
.msg[data-kind="err"]{animation:sfxShake .38s ease both}
.msg[data-kind="info"]{animation:sfxPop .35s var(--sfx-spring) both}
@media(max-width:420px){.sheet{border-radius:24px!important}}
</style>
</head>
<body>
<main class="sheet">
  <header>
    <h1>مدرسهٔ من</h1>
    <p class="lead">با نام کاربری و رمز عبوری که مدرسه به شما داده است وارد شوید.</p>
  </header>

  <p id="boot" class="boot" role="status">در حال بررسی ورود…</p>
  <noscript><p class="msg" data-kind="err">برای ورود باید جاوااسکریپت مرورگر فعال باشد.</p></noscript>

  <form id="loginForm" novalidate hidden>
    <div class="field">
      <label for="username">نام کاربری</label>
      <input id="username" name="username" type="text" inputmode="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
    </div>
    <div class="field">
      <label for="password">رمز عبور</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go">
        <button type="button" id="reveal" class="reveal" aria-controls="password" aria-pressed="false" aria-label="نمایش رمز عبور">نمایش</button>
      </div>
    </div>

    <p id="msg" class="msg" aria-live="polite"></p>

    <button id="go" class="go" type="submit"><span id="goText">ورود</span><span class="spin" aria-hidden="true"></span></button>
    <button id="signout" class="linkbtn" type="button" hidden>خروج از حساب فعلی</button>

    <p class="help">رمز عبور را فراموش کرده‌اید؟ به مدرسه مراجعه کنید تا رمز جدید بگیرید.</p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';

  // Only the public (publishable) key lives here. It is meant for browsers and is limited by RLS in Supabase.
  const SUPABASE_URL = 'https://rwqutztruyodkdrqztfq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_8gp_Xa9qG626mwMsMQ_RHA_oDKU_QBg';

  // profiles.role -> panel. The parent panel accepts both "parent" and "guardian".
  const ROLE_PAGE = {
    manager: 'manager.html',
    teacher: 'teacher.html',
    student: 'student.html',
    parent: 'parent.html',
    guardian: 'parent.html'
  };
  const HITS_KEY = 'school_route_hits';
  const HITS_WINDOW_MS = 20000;
  const HITS_LIMIT = 3;

  const $ = (id) => document.getElementById(id);
  let db = null;
  try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { db = null; }

  /* ---------- small helpers ---------- */
  function show(which) {
    $('boot').hidden = which !== 'boot';
    $('loginForm').hidden = which !== 'form';
    if (which === 'form' && window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches) {
      $('username').focus({ preventScroll: true });
    }
  }
  function say(text, kind) {
    const m = $('msg');
    m.textContent = text || '';
    if (text) m.dataset.kind = kind || 'err'; else delete m.dataset.kind;
  }
  function busy(on) {
    $('go').disabled = on;
    $('go').classList.toggle('busy', on);
    $('goText').textContent = on ? 'در حال ورود…' : 'ورود';
  }
  function latin(s) {
    return String(s)
      .replace(/[\u06F0-\u06F9]/g, (c) => String(c.charCodeAt(0) - 0x06F0))
      .replace(/[\u0660-\u0669]/g, (c) => String(c.charCodeAt(0) - 0x0660));
  }
  function cleanUser(s) {
    return latin(s).replace(/[\s\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, '').toLowerCase();
  }
  function emailOf(u) { return u.indexOf('@') > -1 ? u : u + '@school-demo.ir'; }

  function explain(err) {
    const m = String((err && err.message) || '').toLowerCase();
    const st = err && err.status;
    if (/invalid login credentials|invalid_credentials/.test(m)) return 'نام کاربری یا رمز عبور درست نیست.';
    if (/email not confirmed/.test(m)) return 'این حساب هنوز فعال نشده است. به مدرسه خبر دهید.';
    if (st === 429 || /rate limit|too many/.test(m)) return 'تلاش‌های ناموفق زیاد بود. چند دقیقه بعد دوباره امتحان کنید.';
    if (/failed to fetch|network|load failed|fetch/.test(m)) return 'ارتباط با سرور برقرار نشد. اینترنت را بررسی کنید و دوباره تلاش کنید.';
    return 'ورود انجام نشد. دوباره تلاش کنید؛ اگر تکرار شد به مدرسه خبر دهید.';
  }

  /* ---------- redirect-loop guard ---------- */
  function readHits() {
    try {
      const now = Date.now();
      return JSON.parse(sessionStorage.getItem(HITS_KEY) || '[]').filter((t) => now - t < HITS_WINDOW_MS);
    } catch (e) { return []; }
  }
  function go(page) {
    try { sessionStorage.setItem(HITS_KEY, JSON.stringify(readHits().concat(Date.now()))); } catch (e) { /* ignore */ }
    location.replace(page);
  }
  async function quietSignOut() {
    try { await db.auth.signOut(); } catch (e) { /* ignore */ }
    try { sessionStorage.removeItem(HITS_KEY); } catch (e) { /* ignore */ }
  }

  /* ---------- decide which panel a signed-in user belongs to ---------- */
  async function decide(user) {
    const r = await db.from('profiles').select('id,role,full_name').eq('id', user.id).maybeSingle();
    if (r.error) {
      if (/jwt|expired/i.test(r.error.message || '')) {
        await quietSignOut();
        return { ok: false, msg: 'نشست شما تمام شده است. دوباره وارد شوید.' };
      }
      return { ok: false, msg: explain(r.error) };
    }
    if (!r.data) {
      await quietSignOut();
      return { ok: false, msg: 'پروفایل این حساب پیدا نشد. به مدرسه خبر دهید.' };
    }
    const page = ROLE_PAGE[String(r.data.role || '').trim().toLowerCase()];
    if (!page) {
      await quietSignOut();
      return { ok: false, msg: 'نقش این حساب مشخص نیست. به مدرسه خبر دهید.' };
    }
    return { ok: true, page: page };
  }

  /* ---------- events ---------- */
  $('reveal').addEventListener('click', function () {
    const p = $('password');
    const reveal = p.type === 'password';
    p.type = reveal ? 'text' : 'password';
    this.textContent = reveal ? 'پنهان' : 'نمایش';
    this.setAttribute('aria-pressed', String(reveal));
    this.setAttribute('aria-label', reveal ? 'پنهان کردن رمز عبور' : 'نمایش رمز عبور');
  });

  $('signout').addEventListener('click', async function () {
    await quietSignOut();
    this.hidden = true;
    say('');
  });

  $('loginForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!db) { say('بارگذاری سامانه ناموفق بود. اینترنت را بررسی کنید و صفحه را دوباره باز کنید.'); return; }
    const user = cleanUser($('username').value);
    const pass = $('password').value;
    if (!user || !pass) { say('نام کاربری و رمز عبور را وارد کنید.'); return; }

    say('');
    busy(true);
    let leaving = false;
    try {
      const email = emailOf(user);
      let res = await db.auth.signInWithPassword({ email: email, password: pass });
      // Phones often type Persian digits: if the password as typed was rejected, try it with Latin digits.
      if (res.error && /invalid login credentials/i.test(res.error.message || '') && latin(pass) !== pass) {
        res = await db.auth.signInWithPassword({ email: email, password: latin(pass) });
      }
      if (res.error) { say(explain(res.error)); return; }

      say('ورود انجام شد؛ در حال انتقال به پنل شما…', 'info');
      const out = await decide(res.data.user);
      if (!out.ok) { say(out.msg); return; }
      leaving = true;
      go(out.page);
    } catch (e) {
      say(explain(e));
    } finally {
      if (!leaving) busy(false);
    }
  });

  /* ---------- start: skip the form if a valid session already exists ---------- */
  async function start() {
    if (!db) {
      show('form');
      say('بارگذاری سامانه ناموفق بود. اینترنت را بررسی کنید و صفحه را دوباره باز کنید.');
      $('go').disabled = true;
      return;
    }
    let session = null;
    try {
      const r = await db.auth.getSession();
      session = r && r.data && r.data.session;
    } catch (e) { session = null; }

    if (!session) { show('form'); return; }

    if (readHits().length >= HITS_LIMIT) {
      show('form');
      say('ورود شما چند بار پشت‌سر هم به این صفحه برگشت. از حساب فعلی خارج شوید و دوباره وارد شوید؛ اگر تکرار شد به مدرسه خبر دهید.', 'info');
      $('signout').hidden = false;
      return;
    }

    let out;
    try { out = await decide(session.user); } catch (e) { out = { ok: false, msg: explain(e) }; }
    if (out.ok) { go(out.page); return; }
    show('form');
    say(out.msg);
  }
  start();
})();
</script>
</body>
</html>
